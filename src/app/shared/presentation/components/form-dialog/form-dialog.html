<ng-template #dialog>
  <div class="dialog-heading">
    <h2 mat-dialog-title [id]="titleId">{{ title() | t }}</h2>
    <button mat-icon-button type="button" [attr.aria-label]="'Close dialog' | t" (click)="close()">
      <pp-icon name="close" />
    </button>
  </div>
  <mat-dialog-content><ng-content /></mat-dialog-content>
</ng-template>
